name: yishu-phase12

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://yishu_app:${APP_POSTGRES_PASSWORD:?Run prod.sh init}@postgres:5432/yishu?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?Run prod.sh init}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?Run prod.sh init}
  CONTENT_ENCRYPTION_KEY: ${CONTENT_ENCRYPTION_KEY:?Run prod.sh init}

x-app: &app
  image: yishu-server:${RELEASE_TAG:?Release tag required}
  build:
    context: .
    dockerfile: Dockerfile.prod
    target: runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8443:443", "127.0.0.1:18080:80"]
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      frontend: { ipv4_address: 172.31.231.2 }
    depends_on:
      api: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, https://localhost/api/v1/health]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    <<: *app
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      TRUSTED_PROXY_IP: 172.31.231.2
      MEDIA_STORAGE_DIR: /media
    volumes: ["media_data:/media"]
    networks:
      frontend: { ipv4_address: 172.31.231.3 }
      backend: {}
    healthcheck:
      test: [CMD, node, deploy/healthcheck.mjs, api]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: [node, apps/worker/dist/index.js]
    environment:
      <<: *app-env
    networks: [backend]
    healthcheck:
      test: [CMD, node, deploy/healthcheck.mjs, worker]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  migrate:
    image: yishu-migrate:${RELEASE_TAG:?Release tag required}
    build: { context: ., dockerfile: Dockerfile.prod, target: migrate }
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://yishu:${POSTGRES_PASSWORD:?Run prod.sh init}@postgres:5432/yishu?schema=public
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?Run prod.sh init}
    networks: [backend]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: yishu
      POSTGRES_DB: yishu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prod.sh init}
    restart: unless-stopped
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U yishu -d yishu"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run prod.sh init}
    command:
      [
        sh,
        -c,
        'exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    restart: unless-stopped
    volumes: ["redis_data:/data"]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  frontend:
    ipam:
      config: [{ subnet: 172.31.231.0/28 }]
  backend:
    internal: true

volumes:
  media_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
