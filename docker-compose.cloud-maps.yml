name: yishu-cloud-maps
services:
  map-tiles:
    image: yishu-map-tiles:national-20261005
    pull_policy: never
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    volumes:
      - ./data:/maps:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4180/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
networks:
  default:
    name: yishu-maps
    internal: true
