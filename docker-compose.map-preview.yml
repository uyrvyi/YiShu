services:
  map-tiles:
    build:
      context: .
      dockerfile: Dockerfile.map-tiles
    image: yishu-map-tiles:local
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    ports:
      - "127.0.0.1:4180:4180"
    volumes:
      - ./.local/maps:/maps:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4180/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
