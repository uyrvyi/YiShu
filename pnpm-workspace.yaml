packages:
  - "apps/*"
  - "packages/*"

overrides:
  "fast-uri@>=3 <3.1.7": "3.1.8"
  "fast-uri@>=4 <4.1.4": "4.2.1"
  "@xmldom/xmldom@>=0.8 <0.8.15": "0.8.15"
  "@xmldom/xmldom@>=0.9 <0.9.12": "0.9.12"
  "js-yaml@>=4 <4.3.2": "4.3.2"

allowBuilds:
  "@prisma/engines": true
  argon2: true
  esbuild: true
  msgpackr-extract: false
  prisma: true

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.17"
  - "@expo/fingerprint@0.20.9"
  - "@expo/local-build-cache-provider@57.0.7"
  - "@expo/metro-config@57.0.9"
  - "@expo/prebuild-config@57.0.13"
  - "@expo/router-server@57.0.7"
  - expo-asset@57.0.13
  - expo-constants@57.0.13
  - expo-file-system@57.0.5
  - expo-modules-core@57.0.12
  - expo-modules-jsi@57.0.5
  - expo@57.0.15
  - "@expo/metro-runtime@57.0.12"
  - "@expo/ui@57.0.12"
  - expo-linking@57.0.7
  - expo-router@57.0.15
